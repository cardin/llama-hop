<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Llama Hop</title>
<style>
@font-face { font-family: GokuEmblem; src: url('./goku-emblem.ttf') format('truetype'); font-weight: 700; }
@font-face { font-family: OraSfx; src: url('./ora-sfx.ttf') format('truetype'); font-weight: 900; }
@font-face { font-family: MenacingSfx; src: url('./menacing-sfx.ttf') format('truetype'); font-weight: 500; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f6efdF; color: #344739; font-family: system-ui, sans-serif; }
main { width: min(96vw, 850px); text-align: center; }
.game-layout { display: grid; grid-template-columns: minmax(0, 440px) 320px; gap: 28px; align-items: start; justify-content: center; }
.game-panel { min-width: 0; }
.discoveries { padding: 18px; border-radius: 22px; background: #fff9ec; text-align: left; }
.discoveries h2 { margin: 0 0 6px; font-size: 20px; }
.discoveries p { font-size: 12px; line-height: 1.5; }
.scene-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 8px; }
.scene-card { margin: 0; min-width: 0; }
.scene-card canvas { width: 100%; display: block; border-radius: 8px; image-rendering: pixelated; }
.scene-card figcaption { margin-top: 5px; font-size: 10px; line-height: 1.35; overflow-wrap: anywhere; }
.final-note { font-size: 12px; line-height: 1.5; margin: 10px 0; }
@media (max-width: 720px) { .game-layout { grid-template-columns: minmax(0, 440px); } .discoveries { margin-top: 0; } }
h1 { margin: 16px 0 4px; font-size: 32px; }
p { margin: 0 0 16px; font-size: 14px; }
#game { display: block; width: 100%; border-radius: 22px; box-shadow: 0 10px 30px #34473922; touch-action: none; }
footer { padding: 14px; font-size: 12px; }
button { margin-top: 14px; padding: 12px 24px; border: 0; border-radius: 12px; background: #558c61; color: white; font: bold 16px system-ui; cursor: pointer; }
#clear-state { margin: 10px 0; padding: 9px 16px; background: transparent; color: #8c4d46; border: 1px solid #c9aaa0; font-size: 12px; }
#reset-status { font-size: 12px; }
</style>
</head>
<body>
<main>
<h1>🦙 Llama Hop</h1>
<p>Little llama. Big hops. Endless skies.</p>
<div class="game-layout">
<section class="game-panel" aria-label="Play Llama Hop">
<canvas id="game" width="400" height="560" tabindex="0" aria-label="Llama Hop game. Tap or press space to jump through gaps."></canvas>
<button id="restart" hidden>Play again ↵</button>
<p class="final-note">Final transformation at <strong>103 points</strong> — keep hopping afterward to beat your best!</p>
<footer>Tap, click, or press Space to hop · Pink cacti give +3 points!</footer>
</section>
<aside class="discoveries" aria-labelledby="discoveries-title">
<h2 id="discoveries-title">Worlds to discover</h2>
<p>Pixelated peeks at places you might visit. Keep hopping to reveal them!</p>
<p id="discovery-count" role="status"></p>
<div class="scene-grid" id="scene-grid"></div>
</aside>
</div>
<button id="clear-state" type="button">Clear game state</button>
<p id="reset-status" role="status"></p>
</main>
<script>
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');
// Keep game coordinates at 400×560, but render sharply on high-density screens.
const pixelRatio = Math.min(window.devicePixelRatio || 1, 3);
canvas.width = 400 * pixelRatio; canvas.height = 560 * pixelRatio;
ctx.scale(pixelRatio, pixelRatio);
const restart = document.getElementById('restart');
document.fonts.load('700 12px GokuEmblem', '悟').catch(() => {});
document.fonts.load('900 27px OraSfx', 'オラッ！').catch(() => {});
document.fonts.load('500 15px MenacingSfx', 'ゴゴゴ').catch(() => {});
const ponytaArtwork = new Image();
ponytaArtwork.src = './ponyta.svg';
let state = 'ready', y = 255, velocity = 0, pipes = [], score = 0, best = 0, spawn = 0, last = 0;
let confetti = [], celebration = 0, milestone = 0;
let lives = 3, invulnerable = 0, shake = 0, impact = 0, impactY = 255, hitParticles = [];
let lifeBonus = 0;
let sparkles = [], sparkleSpawn = 0;
let trailParticles = [], trailSpawn = 0, lastTrailKind = null;
const trailStyles = [
  { until: 13, kind: 'dust', colors: ['#e0c6a3', '#fff5db'] },
  { until: 23, kind: 'electric', colors: [] },
  { until: 33, kind: 'energy', colors: ['#f8ce4e', '#fff4af'] },
  { until: 43, kind: 'ember', colors: ['#f19b42', '#e96447'] },
  { until: 53, kind: 'speed', colors: ['#c6edff', '#66a6df'] },
  { until: 63, kind: 'elements', colors: ['#65b8e9', '#ed9d59', '#a6bf8c', '#e4f1ef'] },
  { until: 73, kind: 'magic', colors: ['#e69a49', '#f5cb79'] },
  { until: 83, kind: 'sith', colors: ['#ed5b65', '#ffd2c9'] },
  { until: 93, kind: 'rainbow', colors: [] },
  { until: 103, kind: 'paw', colors: ['#ae7d46', '#e0ba78'] },
  { until: Infinity, kind: 'menacing', colors: ['#52316f'] }
];
let llamaTilt = 0;
const dogePhrases = ['much hop', 'very llama', 'wow'];
let dogeWords = [];
let oraBursts = [];
// Set a score to preview a transformation; null uses normal score progression.
const previewAppearanceScore = null;
function appearanceScore() { return previewAppearanceScore ?? score; }
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const weatherTypes = [
  { name: 'Sunny day', sky: '#c9e9e5', hills: '#b8d5b1', cloud: '#ffffff90', sun: '#ffe49a', landmark: 'windmill' },
  { name: 'Night time', sky: '#263653', hills: '#475e68', cloud: '#71809a70', moon: true, landmark: 'observatory' },
  { name: 'Rainy day', sky: '#91a9b9', hills: '#809e96', cloud: '#d0dae5cc', rain: 1, landmark: 'cottage' },
  { name: 'Dusk', sky: '#e4a0a3', hills: '#ad929c', cloud: '#ffe0c480', sun: '#ffce89', landmark: 'castle' },
  { name: 'Thunderstorm', sky: '#465571', hills: '#637b80', cloud: '#8c9aafcc', rain: 1.5, thunder: true, landmark: 'haunted' },
  { name: 'Hurricane', sky: '#657d87', hills: '#7c9791', cloud: '#aebfc9cc', rain: 2, wind: true, landmark: 'lighthouse' },
  { name: 'Snowfall', sky: '#b8cddb', hills: '#d8e4dc', cloud: '#ffffffb0', snow: true, landmark: 'cabin' },
  { name: 'Fog', sky: '#c5d1cf', hills: '#a9bcb4', cloud: '#eef4f0c0', fog: true, landmark: 'bridge' },
  { name: 'Aurora', sky: '#233c50', hills: '#466c6c', cloud: '#71809a50', moon: true, aurora: true, landmark: 'igloos' },
  { name: 'Sandstorm', sky: '#d5b68b', hills: '#bba17b', cloud: '#e8cca080', dust: true, landmark: 'pyramids' },
  { name: 'Rainbow', sky: '#c9e9e5', hills: '#b8d5b1', cloud: '#ffffff90', sun: '#ffe49a', rainbow: true },
  { name: 'DSO SP20', sky: '#d7eaf0', hills: '#a7c7ad', cloud: '#ffffff90', sun: '#ffe49a', landmark: 'dso' },
  { name: 'Singapore', sky: '#e7b8c8', hills: '#889bb5', cloud: '#ffe6da80', sun: '#ffdcaa', landmark: 'mbs' },
  { name: 'Mordor', sky: '#49363d', hills: '#3a3037', cloud: '#93706a60', landmark: 'mordor' },
  { name: 'Japan', sky: '#cce5f1', hills: '#a6bcab', cloud: '#ffffff90', landmark: 'japan' },
  { name: 'Antarctica', sky: '#c8e7f3', hills: '#e9f5fa', cloud: '#ffffff90', snow: true, landmark: 'antarctica' }
];
let discoveredScenes = new Set();
try {
  const saved = JSON.parse(localStorage.getItem('llama-scenes') || '[]');
  if (Array.isArray(saved)) discoveredScenes = new Set(saved.filter(name => weatherTypes.some(scene => scene.name === name)));
} catch {}
const sceneCards = [];
let weatherElapsed = 0, weatherLast = null;
let currentWeather = 0, previousWeather = 0, weatherChangedAt = 0, nextWeatherChange = 8000;
try { best = Number(localStorage.getItem('llama-best')) || 0; } catch {}
function hop() {
  if (state === 'over') return;
  if (state !== 'playing') {
    state = 'playing'; y = 255; velocity = 0; pipes = []; score = 0; spawn = 0;
    confetti = []; celebration = 0; milestone = 0;
    lives = 3; invulnerable = 0; shake = 0; impact = 0; hitParticles = [];
    lifeBonus = 0;
    sparkles = []; sparkleSpawn = 0;
    trailParticles = []; trailSpawn = 0; lastTrailKind = null;
    llamaTilt = 0;
    dogeWords = [];
    oraBursts = [];
    weatherLast = null;
  }
  velocity = -6.2;
  if (appearanceScore() >= 93 && appearanceScore() < 103) {
    dogeWords.push({ text: dogePhrases[Math.floor(Math.random() * dogePhrases.length)], y: Math.max(82, y - 58), life: 48 });
    dogeWords = dogeWords.slice(-4);
  }
  if (appearanceScore() >= 103) {
    oraBursts.push({ x: 143 + (oraBursts.length % 2) * 18, y: Math.max(90, Math.min(480, y - 25)), life: 40 });
    oraBursts = oraBursts.slice(-4);
  }
}
function playAgain() {
  state = 'ready'; restart.hidden = true; canvas.focus(); hop();
}
restart.addEventListener('click', playAgain);
document.getElementById('clear-state').addEventListener('click', () => {
  if (!window.confirm('Reset your best score, all discovered worlds, and the current game? This cannot be undone.')) return;
  let savedProgressCleared = true;
  try {
    localStorage.removeItem('llama-best');
    localStorage.removeItem('llama-scenes');
  } catch { savedProgressCleared = false; }
  state = 'ready'; y = 255; velocity = 0; pipes = []; score = 0; best = 0; spawn = 0; last = 0;
  confetti = []; celebration = 0; milestone = 0;
  lives = 3; invulnerable = 0; shake = 0; impact = 0; impactY = 255; hitParticles = [];
  lifeBonus = 0; sparkles = []; sparkleSpawn = 0; llamaTilt = 0; dogeWords = []; oraBursts = [];
  trailParticles = []; trailSpawn = 0; lastTrailKind = null;
  weatherElapsed = 0; weatherLast = null;
  currentWeather = 0; previousWeather = 0; weatherChangedAt = 0; nextWeatherChange = 8000;
  discoveredScenes.clear();
  sceneCards.forEach((card, index) => paintSceneCard(index));
  updateDiscoveryCount();
  restart.hidden = true;
  document.getElementById('reset-status').textContent = savedProgressCleared
    ? 'Progress cleared. A fresh adventure awaits!'
    : 'Game reset, but saved progress could not be cleared from browser storage.';
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); hop(); });
window.addEventListener('keydown', e => {
  if (e.target.closest('button')) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault(); if (!e.repeat) hop();
  }
  if (e.code === 'Enter' && state === 'over') {
    e.preventDefault(); if (!e.repeat) playAgain();
  }
});
function end() {
  state = 'over'; best = Math.max(best, score);
  restart.hidden = false;
  try { localStorage.setItem('llama-best', best); } catch {}
}
function loseLife(cactusHit = null) {
  if (state !== 'playing' || invulnerable > 0) return;
  lives--; invulnerable = 90; shake = reducedMotion ? 0 : 25; impact = 45;
  impactY = Math.max(50, Math.min(490, y));
  hitParticles = reducedMotion ? [] : Array.from({ length: 22 }, (_, i) => {
    const angle = i * Math.PI * 2 / 22, speed = 2 + (i % 4);
    return { x: 100, y: impactY, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 40 };
  });
  if (cactusHit) cactusHit.passed = true; // No points for a cactus we hit.
  if (lives === 0) { end(); return; }
  // Recover inside the gap, or away from the sky/ground, without resetting progress.
  y = cactusHit ? cactusHit.top + 85 : Math.max(90, Math.min(450, y));
  velocity = cactusHit ? -2 : y <= 90 ? 2 : -3;
}
function drawImpact(dt) {
  ctx.save();
  for (const p of hitParticles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.08 * dt; p.life -= dt;
    ctx.globalAlpha = Math.max(0, p.life / 40); ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
  }
  hitParticles = hitParticles.filter(p => p.life > 0);
  if (impact > 0) {
    ctx.globalAlpha = Math.min(1, impact / 15);
    ctx.strokeStyle = '#f28f87'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(100, impactY, reducedMotion ? 40 : 12 + (45 - impact) * 1.3, 0, Math.PI * 2); ctx.stroke();
    const labelY = Math.max(65, impactY - 65);
    rounded(52, labelY - 23, 96, 30, 10, '#fff9ec');
    ctx.fillStyle = '#b64f56'; ctx.textAlign = 'center'; ctx.font = 'bold 16px system-ui';
    ctx.fillText('-1 life', 100, labelY - 3);
    impact = Math.max(0, impact - dt);
  }
  ctx.restore();
}
function drawLastLifeWarning(time) {
  if (state !== 'playing' || lives !== 1) return;
  ctx.save();
  const pulse = reducedMotion ? 0.65 : 0.65 + Math.sin(time / 450) * 0.2;
  const glow = ctx.createRadialGradient(200, 280, 140, 200, 280, 340);
  glow.addColorStop(0, 'rgba(215, 55, 75, 0)');
  glow.addColorStop(1, 'rgba(215, 55, 75, 0.5)');
  ctx.globalAlpha = pulse; ctx.fillStyle = glow; ctx.fillRect(0, 0, 400, 560);
  ctx.strokeStyle = '#dc5366'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.roundRect(3, 3, 394, 554, 20); ctx.stroke();
  ctx.restore();
}
function rounded(x, y, w, h, radius, color) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(x, y, w, h, radius); ctx.fill();
}
function awardPoints(points) {
  const previousScore = score;
  score += points;
  const extraLives = Math.floor(score / 9) - Math.floor(previousScore / 9);
  if (extraLives > 0) { lives += extraLives; lifeBonus = 100; }
  if (Math.floor(score / 5) > Math.floor(previousScore / 5)) {
    celebrate(Math.floor(score / 5) * 5);
  }
}
function celebrate(milestoneScore) {
  milestone = milestoneScore; celebration = 100;
  const colors = ['#e79373', '#ffd166', '#558c61', '#ffffff', '#a78bfa'];
  confetti = reducedMotion ? [] : Array.from({ length: 45 }, () => ({
    x: 100, y, vx: (Math.random() - 0.35) * 8, vy: -2 - Math.random() * 6,
    angle: Math.random() * Math.PI, spin: (Math.random() - 0.5) * 0.2,
    life: 85, color: colors[Math.floor(Math.random() * colors.length)]
  }));
}
function drawCelebration(dt) {
  ctx.save();
  for (const p of confetti) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.12 * dt;
    p.angle += p.spin * dt; p.life -= dt;
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 25));
    ctx.translate(p.x, p.y); ctx.rotate(p.angle);
    ctx.fillStyle = p.color; ctx.fillRect(-3, -2, 6, 4); ctx.restore();
  }
  confetti = confetti.filter(p => p.life > 0);
  if (celebration > 0) {
    celebration = Math.max(0, celebration - dt);
    ctx.globalAlpha = Math.min(1, celebration / 20);
    rounded(75, 70, 250, 42, 14, '#fff9ec');
    ctx.fillStyle = '#344739'; ctx.textAlign = 'center'; ctx.font = 'bold 19px system-ui';
    ctx.fillText(`★ ${milestone} points! Llama-zing! ★`, 200, 98);
  }
  ctx.restore();
}
function cactus(x, top, bottom, pink) {
  const color = pink ? '#df79a5' : '#558c61';
  rounded(x, -18, 54, top + 18, 12, color);
  rounded(x, bottom, 54, 530 - bottom, 12, color);
  ctx.strokeStyle = pink ? '#f5b2d0' : '#76a97b'; ctx.lineWidth = 3;
  for (const offset of [16, 36]) {
    ctx.beginPath(); ctx.moveTo(x + offset, 0); ctx.lineTo(x + offset, top - 10);
    ctx.moveTo(x + offset, bottom + 10); ctx.lineTo(x + offset, 530); ctx.stroke();
  }
  if (pink) {
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.font = 'bold 18px system-ui';
    ctx.fillText('+3', x + 27, top - 18);
  }
}
function drawLlamaEffects(time) {
  const score = appearanceScore();
  const t = reducedMotion ? 0 : time / 1000;
  if (score >= 73) return;
  if (score >= 63) {
    drawStrangeMagic(time, false);
    return;
  }
  if (score >= 53) {
    const glow = ctx.createRadialGradient(0, -12, 8, 0, -12, 64);
    glow.addColorStop(0, '#b9edff55'); glow.addColorStop(0.6, '#8dd9ff30');
    glow.addColorStop(1, '#8dd9ff00');
    ctx.fillStyle = glow; ctx.fillRect(-64, -76, 128, 128);
    drawAvatarElements(time, false);
    drawOrbitingStones(time, false);
    return;
  }
  if (score >= 43) {
    ctx.strokeStyle = '#e6f7ffb0'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const drift = reducedMotion ? 0 : (t * 45 + i * 13) % 32;
      const x = -31 - drift, yy = -33 + i * 13;
      ctx.beginPath(); ctx.moveTo(x - 23, yy + 3);
      ctx.quadraticCurveTo(x - 6, yy - 3, x + 7, yy); ctx.stroke();
    }
    return;
  }
  if (score >= 33) {
    drawPonytaFlames(time);
    return;
  }
  if (score >= 23) {
    drawSuperSaiyanAura(time);
  }
}
function drawStrangeMagic(time, front) {
  const t = reducedMotion ? 0 : time / 1000;
  ctx.save(); ctx.lineCap = 'round';
  for (let side = 0; side < 2; side++) {
    if ((side === 1) !== front) continue;
    ctx.save(); ctx.translate(side ? 32 : -31, side ? -6 : -18);
    ctx.rotate(t * (side ? 0.45 : -0.35));
    ctx.shadowColor = '#f39232'; ctx.shadowBlur = 5;
    ctx.strokeStyle = '#ed8628'; ctx.lineWidth = 2;
    for (const radius of [16, 22]) {
      ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.shadowBlur = 0; ctx.strokeStyle = '#ffcf72'; ctx.lineWidth = 1;
    for (let turn = 0; turn < 2; turn++) {
      ctx.save(); ctx.rotate(turn * Math.PI / 4);
      ctx.strokeRect(-11, -11, 22, 22); ctx.restore();
    }
    for (let i = 0; i < 12; i++) {
      ctx.save(); ctx.rotate(i * Math.PI / 6);
      ctx.beginPath(); ctx.moveTo(18, -1); ctx.lineTo(20, -1);
      ctx.lineTo(19, 2); ctx.lineTo(21, 2); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.restore();
}
function drawStrangeCloak(time) {
  const flutter = reducedMotion ? 0 : Math.sin(time / 350) * 3;
  ctx.fillStyle = '#a82638'; ctx.strokeStyle = '#702535'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(12, -23); ctx.lineTo(-8, -20);
  ctx.quadraticCurveTo(-32, -10, -40, 29 + flutter);
  ctx.quadraticCurveTo(-14, 40, 13, 22); ctx.lineTo(12, -23);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#d65350'; ctx.beginPath(); ctx.moveTo(-8, -12);
  ctx.quadraticCurveTo(-16, 10, -29, 29 + flutter); ctx.stroke();
  // Raised collar frames the head without hiding the muzzle or ears.
  ctx.fillStyle = '#b93242'; ctx.beginPath(); ctx.moveTo(6, -17);
  ctx.lineTo(-3, -39); ctx.quadraticCurveTo(10, -39, 12, -23);
  ctx.lineTo(22, -35); ctx.lineTo(20, -14); ctx.closePath(); ctx.fill();
}
function drawSuperSaiyanAura(time) {
  const t = reducedMotion ? 0 : time / 1000;
  ctx.save();
  const glow = ctx.createRadialGradient(0, -15, 12, 0, -15, 73);
  glow.addColorStop(0, '#fff7bc30'); glow.addColorStop(0.55, '#ffdd5960');
  glow.addColorStop(1, '#ffcc3300');
  ctx.fillStyle = glow; ctx.fillRect(-74, -89, 148, 148);
  // A tall, tapered flame envelope, with a clear center around the character.
  for (let layer = 0; layer < 3; layer++) {
    ctx.save(); ctx.translate(0, 29); ctx.scale(1 - layer * 0.16, 1 - layer * 0.12);
    const sway = reducedMotion ? 0 : Math.sin(t * 3 + layer) * 3;
    ctx.fillStyle = ['#efb72a80', '#ffe449b0', '#fff6a0b0'][layer];
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-37, -4, -44, -50);
    ctx.lineTo(-32, -40); ctx.lineTo(-45 + sway, -86);
    ctx.lineTo(-28, -67); ctx.lineTo(-28 + sway, -111);
    ctx.lineTo(-15, -86); ctx.lineTo(-5 + sway, -126);
    ctx.lineTo(6, -103); ctx.lineTo(20 + sway, -121);
    ctx.lineTo(23, -82); ctx.lineTo(38, -99);
    ctx.lineTo(32, -57); ctx.lineTo(46 + sway, -71);
    ctx.quadraticCurveTo(40, -8, 0, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // Thin streams rise along the sides instead of flashing the whole aura.
  ctx.lineCap = 'round'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 14; i++) {
    const travel = reducedMotion ? (i * 17) % 85 : (t * 60 + i * 17) % 85;
    const x = (i % 2 ? -1 : 1) * (25 + (i % 4) * 4);
    const yy = 22 - travel;
    ctx.strokeStyle = i % 3 ? '#fffbc2a0' : '#ffc72b99';
    ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x * 0.9, yy - 10 - (i % 3) * 4); ctx.stroke();
  }
  // Soft blue-white electricity remains part of the 23-point form.
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const angle = i * Math.PI * 2 / 3 + t * 0.35;
      const energy = reducedMotion ? 0.5 : (1 + Math.sin(t * 2 + i * 1.7)) / 2;
      ctx.save(); ctx.translate(0, -10); ctx.rotate(angle);
      ctx.strokeStyle = `rgba(190, 238, 255, ${0.3 + energy * 0.3})`;
      ctx.beginPath(); ctx.moveTo(26, 0); ctx.lineTo(33, -4);
      ctx.lineTo(32, 3); ctx.lineTo(41 + energy * 8, -2); ctx.stroke(); ctx.restore();
    }
  ctx.restore();
}
function drawSuperSaiyanHair() {
  ctx.fillStyle = '#ffdb49'; ctx.strokeStyle = '#d49b29'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(5, -28); ctx.lineTo(-9, -43); ctx.lineTo(-2, -41);
  ctx.lineTo(-9, -57); ctx.lineTo(3, -49); ctx.lineTo(3, -66);
  ctx.lineTo(13, -53); ctx.lineTo(21, -64); ctx.lineTo(23, -49);
  ctx.lineTo(33, -53); ctx.lineTo(25, -34); ctx.lineTo(18, -36);
  ctx.lineTo(12, -30); ctx.closePath(); ctx.fill(); ctx.stroke();

  thumbnail.setAttribute('aria-label', revealed ? weather.name : 'Pixelated preview of an undiscovered world');
}
function discoverScene(weather) {
  if (discoveredScenes.has(weather.name)) return;
  discoveredScenes.add(weather.name);
  try { localStorage.setItem('llama-scenes', JSON.stringify([...discoveredScenes])); } catch {}
  paintSceneCard(weatherTypes.indexOf(weather));
  updateDiscoveryCount();
}
function updateDiscoveryCount() {
  document.getElementById('discovery-count').textContent = `${discoveredScenes.size} / ${weatherTypes.length} worlds discovered`;
}
function initSceneGallery() {
  const grid = document.getElementById('scene-grid');
  weatherTypes.forEach((weather, index) => {
    const card = document.createElement('figure'); card.className = 'scene-card';
    const thumbnail = document.createElement('canvas'); thumbnail.width = 120; thumbnail.height = 108;
    thumbnail.setAttribute('role', 'img');
    card.append(thumbnail, document.createElement('figcaption'));
    grid.append(card); sceneCards.push(card); paintSceneCard(index);
  });
  updateDiscoveryCount();
}
function frame(time) {
  const dt = last ? Math.min((time - last) / 16.667, 2) : 1; last = time;
  advanceWeather(time);
  if (state === 'playing') {
    invulnerable = Math.max(0, invulnerable - dt);
    velocity += 0.32 * dt; y += velocity * dt; spawn -= dt;
    if (spawn <= 0) {
      const top = 90 + Math.random() * 220;
      pipes.push({ x: 410, top, passed: false, pink: Math.random() < 0.15 }); spawn = 105;
    }
    for (const p of pipes) {
      p.x -= 2.5 * dt;
      if (!p.passed && p.x + 54 < 80) {
        p.passed = true; awardPoints(p.pink ? 3 : 1);
      }
      if (p.x < 124 && p.x + 54 > 82 && (y - 34 < p.top || y + 20 > p.top + 170)) loseLife(p);
      if (state === 'over') break;
    }
    pipes = pipes.filter(p => p.x > -60);
    if (y < 38 || y > 508) loseLife();
    if (state === 'playing') y = Math.max(38, Math.min(508, y));
  }
  const targetTilt = Math.max(-0.3, Math.min(0.5, velocity * 0.055));
  llamaTilt += (targetTilt - llamaTilt) * (1 - Math.exp(-0.14 * dt));
  ctx.fillStyle = '#c9e9e5'; ctx.fillRect(0, 0, 400, 560);
  ctx.save();
  if (shake > 0) {
    const strength = 7 * shake / 25;
    ctx.translate(Math.sin(shake * 2.3) * strength, Math.cos(shake * 3.1) * strength);
    shake = Math.max(0, shake - dt);
  }
  drawWeather(weatherElapsed);
  for (const p of pipes) cactus(p.x, p.top, p.top + 170, p.pink);
  const landmark = weatherTypes[currentWeather].landmark;
  ctx.fillStyle = ['antarctica', 'cabin', 'igloos'].includes(landmark) ? '#dceff8' : landmark === 'mordor' ? '#403038' : '#e3cc99';
  ctx.fillRect(0, 530, 400, 30);
  drawLlamaTrail(dt);
  llama(time);
  drawDogeWords(dt);
  drawOraBursts(dt);
  rounded(168, 12, 64, 48, 14, '#fff9ecdd');
  ctx.fillStyle = '#344739'; ctx.textAlign = 'center'; ctx.font = 'bold 36px system-ui'; ctx.fillText(score, 200, 52);
  drawCelebration(dt);
  drawImpact(dt);
  ctx.restore();
  rounded(12, 14, 112, 34, 12, '#fff9ecdd');
  ctx.fillStyle = '#d96b7a'; ctx.textAlign = 'center'; ctx.font = '23px system-ui';
  ctx.fillText(lives > 3 ? `♥ × ${lives}` : '♥'.repeat(lives) + '♡'.repeat(3 - lives), 68, 39);
  if (lifeBonus > 0) {
    ctx.save(); ctx.globalAlpha = Math.min(1, lifeBonus / 20);
    rounded(250, 12, 138, 48, 14, '#fff9ec');
    ctx.fillStyle = '#558c61'; ctx.font = 'bold 18px system-ui'; ctx.fillText('+1 life!', 319, 42);
    ctx.restore(); lifeBonus = Math.max(0, lifeBonus - dt);
  }
  if (state !== 'playing') {
    rounded(35, 310, 330, 135, 18, '#fff9ecf2');
    ctx.font = 'bold 25px system-ui'; ctx.fillStyle = '#344739';
    ctx.fillText(state === 'ready' ? 'Ready to hop?' : 'One more hop?', 200, 347);
    ctx.font = '16px system-ui';
    ctx.fillText(state === 'ready' ? 'Tap or press Space to start' : `Score: ${score}  ·  Best: ${best}`, 200, 380);
    ctx.font = '14px system-ui';
    ctx.fillText(state === 'ready' ? 'Fly through the cactus gaps' : 'Press Enter or click Play again below', 200, 413);
  }
  drawLastLifeWarning(time);
  requestAnimationFrame(frame);
}
initSceneGallery();
requestAnimationFrame(frame);
</script>
